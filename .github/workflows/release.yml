name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: divegrader
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: divegrader.exe
            ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: divegrader
            ext: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Build
        run: cargo build --release -p divegrader --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../divegrader-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          cd ../../..
          sha256sum divegrader-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > divegrader-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../divegrader-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.artifact }}
          cd ../../..
          sha256sum divegrader-${{ github.ref_name }}-${{ matrix.target }}.zip > divegrader-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: divegrader-${{ matrix.target }}
          path: |
            divegrader-*.tar.gz
            divegrader-*.tar.gz.sha256
            divegrader-*.zip
            divegrader-*.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
              text,
              flags=re.S | re.M,
          )
          notes = match.group(0).strip() if match else f"## [{version}]"
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "divegrader ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "${{ github.ref_name }}" \
              --title "divegrader ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
          gh release upload "${{ github.ref_name }}" artifacts/* --clobber
