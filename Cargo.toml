[workspace]
resolver = "2"
members = ["crates/divegrader-core", "crates/divegrader-cli"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
image = "0.25"
rayon = "1"
indicatif = "0.17"
serde_json = "1"